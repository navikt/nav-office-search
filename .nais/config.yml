---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-office-search
  namespace: navno
  labels:
    team: navno
spec:
  image: {{image}}
  port: 3005
  liveness:
    path: {{basePath}}/api/internal/isAlive
    initialDelay: 5
  readiness:
    path: {{basePath}}/api/internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: {{basePath}}/api/internal/metrics
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  envFrom:
    - secret: nav-office-search
  env:
    - name: NPM_CONFIG_CACHE
      value: /tmp/npm-cache
    - name: APP_ORIGIN
      value: {{appOrigin}}
    - name: NAVNO_ORIGIN
      value: {{navnoOrigin}}
    - name: XP_ORIGIN
      value: {{xpOrigin}}
    - name: API_ORIGIN
      value: {{apiOrigin}}
    - name: LOGIN_SESSION_API_URL
      value: {{loginSessionApiUrl}}
  replicas:
  {{#with replicas}}
    min: {{min}}
    max: {{max}}
  {{/with}}
  azure:
    application:
      enabled: true
  idporten:
    enabled: true
    sidecar:
      enabled: true
  ingresses:
    - {{ingress}}
  accessPolicy:
    outbound:
      external:
      {{#each outboundExternalHosts as |host|}}
        - host: {{host}}
      {{/each}}
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
  resources:
  {{#with resources}}
    requests:
      cpu: {{requests.cpu}}
      memory: {{requests.memory}}
    limits:
      memory: {{limits.memory}}
  {{/with}}