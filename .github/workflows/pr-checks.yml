name: PR checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      push-image: false
      # The temporary HTTP characterization suite (test/http/README.md). It rebuilds first, so it mustn't be part of
      # `pnpm test`, which the deploy workflows run between their build and the Docker build.
      post-build-commands: pnpm run test:http
    secrets: inherit
